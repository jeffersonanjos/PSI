{% extends "base.html" %}

{% block title %}Categorias - MemóriaViva{% endblock %}

{% block content %}
<div class="container mt-4 mb-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Categorias</h2>
    <form class="d-flex" method="POST" action="{{ url_for('categories.create_category') }}">
      <input class="form-control me-2" type="text" name="nome" placeholder="Nova categoria" required>
      <button class="btn btn-primary" type="submit">Adicionar</button>
    </form>
  </div>

  {% if categorias %}
  <div class="table-responsive">
    <table class="table table-striped align-middle">
      <thead>
        <tr>
          <th>Nome</th>
          <th class="text-center" style="width: 160px;">Conteúdos</th>
          <th style="width: 120px;"></th>
        </tr>
      </thead>
      <tbody>
        {% for c in categorias %}
        <tr>
          <td>{{ c.name }}</td>
          <td class="text-center">{{ counts.get(c.id, 0) }}</td>
          <td>
            <form method="POST" action="{{ url_for('categories.delete_category', category_id=c.id) }}" onsubmit="return confirm('Excluir categoria?');">
              <button class="btn btn-sm btn-outline-danger" type="submit">
                <i class="bi bi-trash3"></i> Excluir
              </button>
            </form>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
  {% else %}
  <div class="alert alert-info">Nenhuma categoria cadastrada.</div>
  {% endif %}
</div>
{% endblock %}
